name: TDC12 full PEX with audited coupling and pre-post plots

on:
  push:
    branches: ['verification/tdc12-1000cycle-pex']
    paths:
      - '.github/workflows/tdc12-1000cycle-pex.yml'
      - 'verification/bringup_1000cycle/prepare_ci.py'
      - 'verification/bringup_1000cycle/run_spice.py'
      - 'verification/bringup_1000cycle/plot_results.py'
      - 'verification/bringup_1000cycle/README.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tdc12-1000cycle-post-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        stage: [post]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate test code and install Python dependencies
        run: |
          python -m py_compile verification/bringup_1000cycle/*.py
          python -m pip install numpy matplotlib requests zstandard openlane==2.2.9
      - name: Install extraction and compiler tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y magic netgen-lvs build-essential autoconf automake libtool libsuitesparse-dev libreadline-dev tcl-dev tk-dev libx11-dev libxext-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Compile ngspice 44.2 with KLU and OpenMP
        shell: bash
        run: |
          set -euo pipefail
          tdc_eda_prefix="$RUNNER_TEMP/tdc-eda"
          curl -fL --retry 3 'https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/old-releases/44.2/ngspice-44.2.tar.gz' -o "$RUNNER_TEMP/ngspice-44.2.tar.gz"
          sha256sum "$RUNNER_TEMP/ngspice-44.2.tar.gz"
          tar -xzf "$RUNNER_TEMP/ngspice-44.2.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ngspice-44.2"
          ./configure --prefix="$tdc_eda_prefix" --with-x=no --with-readline=no --enable-xspice --enable-cider --enable-openmp --with-klu --disable-debug > "$RUNNER_TEMP/ngspice-configure.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ngspice-configure.log"; exit 1; }
          make -j2 > "$RUNNER_TEMP/ngspice-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ngspice-build.log"; exit 1; }
          make install > "$RUNNER_TEMP/ngspice-install.log" 2>&1
          # Magic and Netgen are built from compatible pinned source below.
          echo "$tdc_eda_prefix/bin" >> "$GITHUB_PATH"
          "$tdc_eda_prefix/bin/ngspice" -v
      - name: Build PDK-compatible Magic and Netgen from pinned sources
        shell: bash
        run: |
          set -euo pipefail
          tdc_eda_prefix="$RUNNER_TEMP/tdc-eda"
          curl -fL --retry 3 --connect-timeout 30 --max-time 180 'https://github.com/RTimothyEdwards/magic/archive/1d42dfcdf6cd91df7a59198477324c2ca78ba439.tar.gz' -o "$RUNNER_TEMP/magic.tar.gz"
          tar -xzf "$RUNNER_TEMP/magic.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/magic-1d42dfcdf6cd91df7a59198477324c2ca78ba439"
          cat VERSION
          ./configure --prefix="$tdc_eda_prefix" --with-tcl --without-x --without-opengl --disable-readline > "$RUNNER_TEMP/magic-configure.log" 2>&1 || { tail -100 "$RUNNER_TEMP/magic-configure.log"; exit 1; }
          make -j2 > "$RUNNER_TEMP/magic-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/magic-build.log"; exit 1; }
          make install > "$RUNNER_TEMP/magic-install.log" 2>&1
          curl -fL --retry 3 --connect-timeout 30 --max-time 180 'https://github.com/RTimothyEdwards/netgen/archive/e2a49567d5e3e451d51130de0227678be31f32e0.tar.gz' -o "$RUNNER_TEMP/netgen.tar.gz"
          tar -xzf "$RUNNER_TEMP/netgen.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/netgen-e2a49567d5e3e451d51130de0227678be31f32e0"
          cat VERSION
          ./configure --prefix="$tdc_eda_prefix" > "$RUNNER_TEMP/netgen-configure.log" 2>&1 || { tail -100 "$RUNNER_TEMP/netgen-configure.log"; exit 1; }
          make -j2 > "$RUNNER_TEMP/netgen-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/netgen-build.log"; exit 1; }
          make install > "$RUNNER_TEMP/netgen-install.log" 2>&1
          "$tdc_eda_prefix/bin/magic" --version
      - name: Recover exact official GDS and routed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python verification/bringup_1000cycle/prepare_ci.py
      - name: Fetch checksum-verified exact PDK
        run: python verification/tdc12_b1c7dec/scripts/fetch_exact_pdk.py
      - name: Extract actual GDS devices and verify LVS
        if: matrix.stage == 'post'
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 1024
          export PDK_ROOT="$GITHUB_WORKSPACE/verification/.tooling/pdk_8afc8346"
          python verification/tdc12_b1c7dec/scripts/extract_gds_devices.py --pdk-root "$PDK_ROOT"
          python verification/tdc12_b1c7dec/scripts/run_device_lvs.py --pdk-root "$PDK_ROOT"
      - name: Run the complete transistor transient and check all wrapper outputs
        shell: bash
        run: |
          set -euo pipefail
          export PDK_ROOT="$GITHUB_WORKSPACE/verification/.tooling/pdk_8afc8346"
          tdc_stage='${{ matrix.stage }}'
          tdc_extra=()
          if [ "$tdc_stage" = pre ]; then tdc_extra+=(--prelayout); fi
          python verification/bringup_1000cycle/run_spice.py --root verification/tdc12_b1c7dec --pdk-root "$PDK_ROOT" "${tdc_extra[@]}"
      - name: Preserve measured data, executed decks and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdc12-${{ matrix.stage }}-raw
          path: verification/tdc12_b1c7dec/reports/bringup_1000cycle/
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: warn

  plot:
    if: always()
    needs: simulate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: verification/tdc12-1000cycle-pex
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: tdc12-*-raw
          merge-multiple: true
          path: verification/bringup_1000cycle/runs
      - name: Recover the already-running full pre-layout data
        uses: actions/download-artifact@v4
        with:
          name: tdc12-pre-raw
          run-id: 44799177056
          github-token: ${{ github.token }}
          path: verification/bringup_1000cycle/runs
      - name: Plot the measured full-length pre and post results
        env:
          TDC_PRE_RUN_ID: '44799177056'
        run: python verification/bringup_1000cycle/plot_results.py
      - name: Preserve complete plot and result package
        uses: actions/upload-artifact@v4
        with:
          name: TDC12-1000cycle-Pre-Post-PEX-Results
          path: verification/bringup_1000cycle/results/
          retention-days: 90
      - name: Save reviewable figures and compact measured records on verification branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f verification/bringup_1000cycle/results
          if ! git diff --cached --quiet; then
            git commit -m 'Save measured TDC12 1000-cycle pre/post-layout results'
            git push origin HEAD:verification/tdc12-1000cycle-pex
          fi
      - name: Require both measured tests to pass
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('verification/bringup_1000cycle/results/summary.json')
          s=json.loads(p.read_text())
          assert s['all_passed'], 'Measured pre/post waveform checks failed; results remain preserved for review'
          PY
